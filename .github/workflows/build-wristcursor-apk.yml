name: Build BLE Remote R08/R10 APKs

on:
  push:
    branches: [ble-remote-test, ble-remote-r10, ble-remote-r11, ble-remote-r12, ble-remote-r14-self-arm]
  workflow_dispatch:

jobs:
  build:
    name: Build BLE watch and Rokid test APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build BLE debug APKs
        run: bash ./gradlew :blewatch:assembleDebug :blerokid:assembleDebug :blephoto:assembleDebug :blevideo:assembleDebug --stacktrace --no-daemon

      - name: Upload watch BLE APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rokid-BLE-Remote-Watch-debug-APK
          path: blewatch/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Rokid BLE receiver APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rokid-BLE-Receiver-debug-APK
          path: blerokid/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload one-tap Photo APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rokid-Photo-R10-APK
          path: blephoto/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload one-tap Video APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rokid-Video-R10-APK
          path: blevideo/build/outputs/apk/debug/*.apk
          if-no-files-found: error
