name: Build WristCursor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: bash ./gradlew :app:assembleDebug :rokidreceiver:assembleDebug --stacktrace --no-daemon

      - name: Upload watch APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WristCursor-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Rokid receiver APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Drift-Rokid-Receiver-debug-APK
          path: rokidreceiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error
